<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDFs in this folder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #2a2a3a;
    --border-h: #4a4a6a;
    --accent: #e8d5b0;
    --accent2: #c4a882;
    --text: #f0ede8;
    --muted: #8a8799;
    --dim: #4a4860;
    --red: #d45a4a;
    --green: #5ab87a;
    --font-head: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 52px 24px 80px;
  }

  .wrap { width: 100%; max-width: 720px; }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 10px;
    font-family: var(--font-mono);
  }

  h1 {
    font-family: var(--font-head);
    font-size: clamp(26px, 5vw, 40px);
    font-weight: 800;
    color: var(--text);
    line-height: 1.1;
    margin-bottom: 6px;
  }

  h1 span { color: var(--accent); }

  .repo-path {
    font-size: 12px;
    color: var(--dim);
    margin-top: 4px;
    word-break: break-all;
  }

  .repo-path strong { color: var(--muted); }

  hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 28px 0 20px;
  }

  /* status */
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
  }

  .dot.spin { background: var(--accent2); animation: pulse 1s infinite; }
  .dot.ok   { background: var(--green); }
  .dot.err  { background: var(--red); }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }

  /* error */
  .err-box {
    background: #1a0f0f;
    border: 1px solid #4a1a1a;
    color: #e87878;
    border-radius: 6px;
    padding: 12px 16px;
    font-size: 12px;
    margin-bottom: 16px;
    display: none;
  }
  .err-box.show { display: block; }

  /* results header */
  .rhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .count { font-size: 13px; color: var(--accent); font-family: var(--font-head); font-weight: 700; }

  /* pdf cards */
  .pdf-list { display: flex; flex-direction: column; gap: 8px; }

  .pdf-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 13px 16px;
    display: grid;
    grid-template-columns: 34px 1fr auto;
    align-items: center;
    gap: 12px;
    transition: border-color .18s, background .18s;
    animation: fadeUp .22s ease both;
  }

  .pdf-card:hover { border-color: var(--border-h); background: #1b1b28; }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .pdf-icon {
    width: 34px; height: 34px;
    border-radius: 6px;
    background: #200f0f;
    border: 1px solid #5a2020;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .pdf-icon svg { width: 17px; height: 17px; fill: #d45a4a; }

  .pdf-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .pdf-size { font-size: 11px; color: var(--muted); }

  .pdf-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .abtn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: border-color .18s, color .18s;
    white-space: nowrap;
  }

  .abtn:hover { border-color: var(--border-h); color: var(--text); }

  .abtn.dl {
    background: #1e1a0f;
    border-color: #4a3e20;
    color: var(--accent2);
  }

  .abtn.dl:hover { border-color: var(--accent); color: var(--accent); }

  /* empty */
  .empty {
    text-align: center;
    padding: 60px 0;
    color: var(--dim);
    font-size: 13px;
    display: none;
  }

  .empty.show { display: block; }
  .empty-icon { font-size: 32px; margin-bottom: 10px; opacity: .35; }

  @media (max-width: 480px) {
    .pdf-card { grid-template-columns: 34px 1fr; }
    .pdf-actions { grid-column: 1/-1; padding-left: 46px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Current directory</p>
  <h1>PDF <span>Files</span></h1>
  <p class="repo-path" id="repo-path"></p>

  <hr>

  <div class="status" id="status">
    <div class="dot spin" id="dot"></div>
    <span id="status-txt">Detecting repository…</span>
  </div>

  <div class="err-box" id="err-box"></div>

  <div id="results" style="display:none">
    <div class="rhead">
      <div class="count" id="count"></div>
    </div>
    <div class="pdf-list" id="pdf-list"></div>
    <div class="empty" id="empty">
      <div class="empty-icon">📂</div>
      <div>No PDF files found in this directory.</div>
    </div>
  </div>
</div>

<script>
  function fmt(bytes) {
    if (!bytes) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(2) + ' MB';
  }

  function setStatus(state, txt) {
    document.getElementById('dot').className = 'dot ' + state;
    document.getElementById('status-txt').textContent = txt;
  }

  function showErr(msg) {
    const b = document.getElementById('err-box');
    b.textContent = msg;
    b.classList.add('show');
  }

  function parseLocation() {
    // Works when hosted on GitHub Pages at:
    // https://<owner>.github.io/<repo>/path/to/file.html
    // or raw github.com pages / custom domains aren't supported
    const loc = window.location;
    const host = loc.hostname; // e.g. abhimanyughjk.github.io
    const pathname = loc.pathname; // e.g. /repo/folder/pdf-viewer.html

    // github.io pattern
    const ghio = host.match(/^([^.]+)\.github\.io$/);
    if (ghio) {
      const owner = ghio[1];
      const parts = pathname.replace(/^\//, '').split('/');
      // parts[0] = repo name, rest = path inside repo
      const repo = parts[0] || '';
      // directory = everything except the filename (last segment)
      const dirParts = parts.slice(1, -1); // drop repo and filename
      const dirPath = dirParts.join('/');
      return { owner, repo, branch: 'HEAD', dirPath };
    }

    // Fallback: try to detect if running from a raw github URL
    // https://raw.githubusercontent.com/<owner>/<repo>/<branch>/path/file.html
    if (host === 'raw.githubusercontent.com') {
      const parts = pathname.replace(/^\//, '').split('/');
      const owner = parts[0], repo = parts[1], branch = parts[2];
      const dirParts = parts.slice(3, -1);
      return { owner, repo, branch, dirPath: dirParts.join('/') };
    }

    return null;
  }

  async function init() {
    const loc = parseLocation();

    if (!loc) {
      setStatus('err', 'Could not detect GitHub repository from this URL.');
      showErr(
        'This page must be hosted on GitHub Pages (*.github.io) to auto-detect its location. ' +
        'Current host: ' + window.location.hostname
      );
      return;
    }

    const { owner, repo, branch, dirPath } = loc;
    const displayPath = `${owner}/${repo}${dirPath ? '/' + dirPath : ''}`;
    document.getElementById('repo-path').innerHTML = `<strong>${displayPath}</strong>`;
    document.title = 'PDFs — ' + displayPath;

    setStatus('spin', `Scanning ${displayPath}…`);

    const apiPath = dirPath || '';
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${apiPath}?ref=${branch}`;

    try {
      const res = await fetch(url, { headers: { Accept: 'application/vnd.github.v3+json' } });

      if (!res.ok) {
        if (res.status === 404) throw new Error('Repository or path not found. Make sure the repo is public.');
        if (res.status === 403) throw new Error('GitHub API rate limit hit. Wait a minute and try again.');
        throw new Error('GitHub API error: ' + res.status);
      }

      const items = await res.json();
      const pdfs = (Array.isArray(items) ? items : [items])
        .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.pdf'))
        .sort((a, b) => a.name.localeCompare(b.name));

      setStatus('ok', pdfs.length
        ? `Found ${pdfs.length} PDF${pdfs.length !== 1 ? 's' : ''} in this directory.`
        : 'Scan complete.');

      document.getElementById('results').style.display = 'block';
      document.getElementById('count').textContent =
        pdfs.length + ' PDF' + (pdfs.length !== 1 ? 's' : '') + ' found';

      if (pdfs.length === 0) {
        document.getElementById('empty').classList.add('show');
        return;
      }

      const list = document.getElementById('pdf-list');
      pdfs.forEach((pdf, i) => {
        const card = document.createElement('div');
        card.className = 'pdf-card';
        card.style.animationDelay = (i * 35) + 'ms';
        card.innerHTML = `
          <div class="pdf-icon">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zm-3.5 8.5c-.25 0-.45-.08-.62-.25-.42-.42-.27-1.1.08-1.78.36-.68.94-1.42 1.62-2.04-.5-1.17-.84-2.27-.84-3.13 0-.75.28-1.3 1.01-1.3.68 0 1.01.5 1.01 1.3 0 .68-.33 1.6-.76 2.6.25.43.5.83.76 1.1.34.34.67.5 1.09.5.5 0 1-.25 1.42-.75.17-.18.35-.27.59-.27.42 0 .67.34.67.68 0 .17-.08.34-.17.5-.67.76-1.51 1.1-2.51 1.1-.67 0-1.26-.25-1.84-.84l-.25-.34c-.34.42-.67.76-.92 1-.34.17-.67.17-1.17.17z"/></svg>
          </div>
          <div>
            <div class="pdf-name" title="${pdf.name}">${pdf.name}</div>
            <div class="pdf-size">${fmt(pdf.size)}</div>
          </div>
          <div class="pdf-actions">
            ${pdf.download_url ? `<a class="abtn" href="${pdf.download_url}" target="_blank" rel="noopener">View</a>` : ''}
            ${pdf.download_url ? `<a class="abtn dl" href="${pdf.download_url}" download target="_blank" rel="noopener">↓ Download</a>` : ''}
          </div>
        `;
        list.appendChild(card);
      });

    } catch (err) {
      setStatus('err', 'Scan failed.');
      showErr(err.message);
    }
  }

  init();
</script>
</body>
</html>
